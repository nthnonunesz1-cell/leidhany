<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raspadinha da Leidhany</title>
<meta name="description" content="Raspe o bilhete e descubra uma frase da festa de aniversário da Leidhany.">
<meta property="og:title" content="Raspadinha da Leidhany">
<meta property="og:description" content="Tem uma frase escondida no bilhete. Raspe a sua!">
<meta name="theme-color" content="#FFD23F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  /* ===== CORES E FONTES (troque aqui para combinar com a camisa) ===== */
  :root {
    --fundo: #FFD23F;          /* amarelo do fundo */
    --bilhete: #FF4F8B;        /* rosa do bilhete */
    --bilhete-escuro: #D93670;
    --papel: #FFF5F9;          /* fundo onde a frase aparece */
    --tinta: #2B0F4C;          /* roxo dos textos e contornos */
    --destaque: #1FB5A8;       /* turquesa do botão do WhatsApp */
    --fonte-titulo: "Bagel Fat One", "Arial Black", system-ui, sans-serif;
    --fonte-texto: "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background-color: var(--fundo);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255, 79, 139, .38) 0 4px, transparent 5px),
      radial-gradient(circle at 70% 80%, rgba(43, 15, 76, .16) 0 3px, transparent 4px),
      radial-gradient(circle at 85% 20%, rgba(31, 181, 168, .38) 0 4px, transparent 5px);
    background-size: 90px 90px, 70px 70px, 110px 110px;
    color: var(--tinta);
    font-family: var(--fonte-texto);
    display: flex;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* ===== Cabeçalho ===== */
  .cabecalho { text-align: center; }
  h1 {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .h1-pre {
    font-weight: 700;
    font-size: 1.15rem;
  }
  .h1-nome {
    font-family: var(--fonte-titulo);
    font-weight: 400;
    font-size: clamp(3rem, 15vw, 4.4rem);
    text-shadow: 4px 4px 0 var(--bilhete);
    transform: rotate(-3deg);
    margin-top: 8px;
  }
  .cabecalho p {
    margin-top: 16px;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.35;
  }

  /* ===== Bilhete ===== */
  .bilhete-sombra {
    width: 100%;
    filter: drop-shadow(0 6px 0 var(--tinta));
  }
  .bilhete-sombra.trocando { animation: entra .35s ease-out; }
  @keyframes entra {
    from { transform: translateY(12px) rotate(-2deg); }
    to   { transform: none; }
  }

  /* ===== Palco: bilhete + polaroid que salta de trás dele ===== */
  .palco {
    position: relative;
    width: 100%;
  }
  .palco .bilhete-sombra {
    position: relative;
    z-index: 2;
  }

  .polaroid {
    --pw: 200px;          /* largura (calculada no JS) */
    --giro: -6deg;        /* inclinação (sorteada no JS) */
    --sobre: 46px;        /* quanto ela fica por cima do bilhete */
    position: absolute;
    z-index: 1;
    left: 50%;
    bottom: calc(100% - var(--sobre));
    width: var(--pw);
    margin: 0 0 0 calc(var(--pw) / -2);
    padding: 10px 10px 0;
    background: #fff;
    border-radius: 3px;
    box-shadow: 0 8px 18px rgba(43, 15, 76, .3);
    opacity: 0;
    transform: translateY(85%);
    pointer-events: none;
  }
  .polaroid::before { /* fita adesiva */
    content: "";
    position: absolute;
    top: -11px;
    left: 50%;
    width: 76px;
    height: 24px;
    margin-left: -38px;
    background: rgba(255, 246, 214, .8);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
    transform: rotate(-4deg);
  }
  .polaroid img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    object-fit: cover;
    background: #EDE6EE;
  }
  .polaroid figcaption {
    padding: 7px 0 10px;
    font-family: "Caveat", "Comic Sans MS", cursive;
    font-weight: 700;
    font-size: 1.6rem;
    line-height: 1;
    text-align: center;
    color: var(--tinta);
  }
  .polaroid figcaption .coracao { color: var(--bilhete); }

  .polaroid.saltou {
    z-index: 3;
    opacity: 1;
    transform: translateY(0) rotate(var(--giro));
    animation: salta .9s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes salta {
    0%   { z-index: 1; opacity: 1; transform: translateY(85%) rotate(0deg); }
    55%  { z-index: 1; transform: translateY(-14%) rotate(calc(var(--giro) * 2)); }
    56%  { z-index: 3; }
    100% { z-index: 3; opacity: 1; transform: translateY(0) rotate(var(--giro)); }
  }
  .polaroid.guardando { animation: guarda .35s ease-in forwards; }
  @keyframes guarda {
    from { z-index: 1; opacity: 1; transform: translateY(0) rotate(var(--giro)); }
    to   { z-index: 1; opacity: 0; transform: translateY(85%) rotate(0deg); }
  }

  .bilhete {
    background: var(--bilhete);
    border-radius: 14px;
    padding: 16px 24px 12px;
    -webkit-mask:
      radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
    mask:
      radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
      radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
  }

  .bilhete-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-weight: 800;
    font-size: 1.05rem;
  }
  .numero {
    font-family: var(--fonte-titulo);
    font-weight: 400;
    font-size: 1.25rem;
    white-space: nowrap;
  }

  .area-raspar {
    position: relative;
    margin: 12px 0;
    min-height: 210px;
    display: grid;
    place-items: center;
    padding: 22px 18px;
    background: var(--papel);
    border: 3px solid var(--tinta);
    border-radius: 12px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .frase {
    font-weight: 800;
    font-size: clamp(1.3rem, 5.6vw, 1.65rem);
    line-height: 1.25;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: break-word;
    white-space: pre-line; /* respeita as quebras de linha das frases */
    min-width: 0;
    max-width: 100%;
  }
  .frase.longa { font-size: clamp(1.12rem, 4.8vw, 1.4rem); }
  .cobertura {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity .45s ease;
  }
  .cobertura:active { cursor: grabbing; }
  .cobertura.sumindo { opacity: 0; pointer-events: none; }

  .bilhete-rodape {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding-top: 10px;
    border-top: 2px dashed rgba(43, 15, 76, .45);
    font-weight: 700;
    font-size: .95rem;
  }
  .botao-texto {
    background: none;
    border: 0;
    padding: 4px 0;
    font: 700 .95rem var(--fonte-texto);
    color: var(--tinta);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ===== Botões ===== */
  .acoes {
    width: 100%;
    display: grid;
    gap: 14px;
    margin-top: 4px;
  }
  .botao {
    display: block;
    width: 100%;
    padding: 14px 20px;
    border: 3px solid var(--tinta);
    border-radius: 999px;
    font: 800 1.15rem var(--fonte-texto);
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--tinta);
    transition: transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .botao:active { transform: translateY(4px); box-shadow: 0 0 0 var(--tinta); }
  .botao-principal {
    background: var(--tinta);
    color: #fff;
    box-shadow: 0 4px 0 var(--bilhete-escuro);
  }
  .botao-principal:active { box-shadow: 0 0 0 var(--bilhete-escuro); }
  .botao-zap { background: var(--destaque); color: var(--tinta); }
  .botao-fotos { background: var(--papel); color: var(--tinta); }

  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }

  .contador {
    min-height: 1.4em;
    font-weight: 600;
    font-size: 1rem;
    text-align: center;
  }

  .so-leitor {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #confete {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  @media (max-width: 360px) {
    .bilhete { padding: 14px 18px 12px; }
    .bilhete-topo { font-size: .98rem; }
    .cabecalho p { font-size: .98rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="cabecalho">
    <h1>
      <span class="h1-pre">Aniversário da</span>
      <span class="h1-nome" id="nome">Leidhany</span>
    </h1>
    <p>Tem uma frase escondida no bilhete.<br>Raspe com o dedo.</p>
  </header>

  <div class="palco" id="palco">
  <figure class="polaroid" id="polaroid" aria-hidden="true">
    <img id="fotoImg" alt="Foto da aniversariante" width="640" height="640" decoding="async">
    <figcaption><span id="legenda">Leidy</span> <span class="coracao">♥</span></figcaption>
  </figure>

  <div class="bilhete-sombra" id="bilheteSombra">
    <section class="bilhete" aria-label="Bilhete de raspadinha">
      <div class="bilhete-topo">
        <span>Raspadinha da festa</span>
        <span class="numero" id="numero">nº 001</span>
      </div>

      <div class="area-raspar" id="area">
        <p class="frase" id="frase" aria-hidden="true"></p>
        <canvas class="cobertura" id="cobertura" role="img" aria-label="Área prateada para raspar"></canvas>
      </div>

      <div class="bilhete-rodape">
        <span>Prêmio garantido: uma risada.</span>
        <button type="button" class="botao-texto" id="btnRevelar">Revelar sem raspar</button>
      </div>
    </section>
  </div>
  </div>

  <div class="acoes">
    <button type="button" class="botao botao-principal" id="btnOutra">Raspar outra</button>
    <a class="botao botao-zap" id="btnZap" href="#" target="_blank" rel="noopener" hidden>Mandar no WhatsApp</a>
    <a class="botao botao-fotos" id="btnFotos" href="#" target="_blank" rel="noopener" hidden>Tirar foto com a arte da festa</a>
  </div>

  <p class="contador" id="contador"></p>
  <p class="so-leitor" id="aviso" aria-live="polite"></p>
</main>

<canvas id="confete" aria-hidden="true"></canvas>

<script>
/* =====================================================================
   CONFIGURAÇÃO — edite só esta parte
   - aniversariante: nome que aparece no topo e nas frases com {nome}
   - linkFotos: cole o link do site de fotos da festa para aparecer o
     botão "Tirar foto com a arte da festa" (deixe "" para esconder)
   - frases: pode adicionar, tirar ou trocar à vontade
     (use \n dentro da frase para quebrar a linha)
   - fotos: fotos da polaroid que salta quando revela a frase. Ficam na
     mesma pasta do index.html. Deixe [] para não mostrar polaroid.
   - legendaFoto: o que vem escrito embaixo da foto
   ===================================================================== */
const CONFIG = {
  aniversariante: "Leidhany",
  linkFotos: "",
  fotos: [
    "leidy-01.jpg", "leidy-02.jpg", "leidy-03.jpg", "leidy-04.jpg",
    "leidy-05.jpg", "leidy-06.jpg", "leidy-07.jpg", "leidy-08.jpg",
    "leidy-09.jpg", "leidy-10.jpg", "leidy-11.jpg"
  ],
  legendaFoto: "Leidy",
  frases: [
    "Aviso aos convidados:\nA aniversariante não se responsabiliza por fotos, vídeos e resenhas após o cooler.",
    "Está gostando da festa?\nEntão dance como se ninguém estivesse filmando.",
    "Está gostando da festa?\nPegue o microfone e faça um elogio a Leidy.",
    "Está gostando da festa?\nJunte a galera e tire fotos.",
    "Nosso lema hoje é divertir à vontade.",
    "Coma, beba e divirta-se à vontade.",
    "E não pode faltar o…\n#ColaEmMimQueÉSucesso",
    "Se não aguenta…",
    "Aqui a resenha é garantida.\nFaça parte das nossas risadas.",
    "Cante uma música dedicada à aniversariante.",
    "Brinde com alguém que você ainda não abraçou hoje.",
    "Está gostando da festa?\nPegue o microfone e diga por que Leidy merece ser celebrada.",
    "Entreviste alguém:\nQual é o segredo da juventude de Leidy?",
    "Pegue o microfone e peça às Divas para cantar a música de Ninha.",
    "Aqui só é permitido sair no final da festa…\nDepois de tudo arrumado.",
    "Você faz parte da minha história.\nObrigada por estar aqui.",
    "Meus pais. Amor incondicional ❤️\nRepasse esse recado para eles.",
    "Esposo e filho sempre me apoiando. Amo vocês ❤️\nChame eles para aquela foto massa!",
    "Tome aquele drink no capricho."
  ]
};

(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const nome = CONFIG.aniversariante;
  const frases = CONFIG.frases.map((f) => f.replaceAll("{nome}", nome));
  const total = frases.length;
  const reduzMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const elNome = $("#nome");
  const elFrase = $("#frase");
  const elNumero = $("#numero");
  const elContador = $("#contador");
  const elAviso = $("#aviso");
  const sombra = $("#bilheteSombra");
  const area = $("#area");
  const canvas = $("#cobertura");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const btnOutra = $("#btnOutra");
  const btnRevelar = $("#btnRevelar");
  const btnZap = $("#btnZap");
  const btnFotos = $("#btnFotos");

  elNome.textContent = nome;
  document.title = "Raspadinha da " + nome;

  if (CONFIG.linkFotos) {
    btnFotos.href = CONFIG.linkFotos;
    btnFotos.hidden = false;
  }

  /* ---------- Estado salvo no celular (sem repetir frase) ---------- */
  const CHAVE = "raspadinha-" + nome.toLowerCase();

  function embaralhar(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function lerEstado() {
    try {
      const e = JSON.parse(localStorage.getItem(CHAVE));
      if (
        e && Array.isArray(e.ordem) && e.ordem.length === total &&
        Number.isInteger(e.pos) && e.pos >= 0 && e.pos <= total &&
        Number.isInteger(e.lidas) && e.lidas >= 0
      ) return e;
    } catch (_) { /* sem armazenamento: segue sem salvar */ }
    return null;
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (_) { /* ignora */ }
  }

  let estado = lerEstado() || { ordem: embaralhar(total), pos: 0, lidas: 0 };
  let indiceAtual = -1;
  let revelada = false;
  let geracao = 0;

  function reembaralhar() {
    const anterior = indiceAtual;
    estado.ordem = embaralhar(total);
    if (total > 1 && estado.ordem[0] === anterior) {
      [estado.ordem[0], estado.ordem[1]] = [estado.ordem[1], estado.ordem[0]];
    }
    estado.pos = 0;
  }

  function atualizarContador() {
    if (estado.lidas === 0) {
      elContador.textContent = "São " + total + " frases escondidas. Boa sorte.";
    } else if (estado.lidas < total) {
      elContador.textContent = "Você já raspou " + estado.lidas + " de " + total + " frases.";
    } else {
      elContador.textContent = "Você raspou todas as " + total + ". Agora elas vão se repetir.";
    }
  }

  /* ---------- Cobertura prateada ---------- */
  let tamanhoPintado = "";
  let riscos = 0;

  function pintarCobertura() {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tamanhoPintado = Math.round(r.width) + "x" + Math.round(r.height);
    riscos = 0;

    ctx.globalCompositeOperation = "source-over";
    const g = ctx.createLinearGradient(0, 0, r.width, r.height);
    g.addColorStop(0, "#E9EBF0");
    g.addColorStop(0.45, "#B9BECA");
    g.addColorStop(0.55, "#C8CCD6");
    g.addColorStop(1, "#DDE0E7");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, r.width, r.height);

    // brilho granulado de raspadinha
    const pontos = Math.round((r.width * r.height) / 45);
    for (let i = 0; i < pontos; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,.55)" : "rgba(80,86,102,.22)";
      ctx.fillRect(Math.random() * r.width, Math.random() * r.height, 1.6, 1.6);
    }

    ctx.fillStyle = "#5E6475";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = '800 26px "Baloo 2", system-ui, sans-serif';
    ctx.fillText("Raspe aqui", r.width / 2, r.height / 2 - 12);
    ctx.font = '600 16px "Baloo 2", system-ui, sans-serif';
    ctx.fillText("com o dedo", r.width / 2, r.height / 2 + 18);

    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    ctx.strokeStyle = "#000";
  }

  function tamanhoAtual() {
    const r = canvas.getBoundingClientRect();
    return Math.round(r.width) + "x" + Math.round(r.height);
  }

  function repintarSePreciso() {
    if (revelada || riscos > 0) return;
    if (tamanhoAtual() !== tamanhoPintado) pintarCobertura();
  }

  if ("ResizeObserver" in window) {
    new ResizeObserver(repintarSePreciso).observe(canvas);
  } else {
    window.addEventListener("resize", repintarSePreciso);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (!revelada && riscos === 0) pintarCobertura();
    });
  }

  /* ---------- Raspar ---------- */
  const RAIO = 22;
  let raspando = false;
  let ultimo = null;
  let ultimaChecagem = 0;

  function ponto(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function riscar(p) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = RAIO * 2;
    ctx.beginPath();
    if (ultimo) {
      ctx.moveTo(ultimo.x, ultimo.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      ctx.arc(p.x, p.y, RAIO, 0, Math.PI * 2);
      ctx.fill();
    }
    ultimo = p;
    riscos++;
  }

  function checar() {
    if (revelada) return;
    const w = canvas.width, h = canvas.height;
    if (!w || !h) return;
    const dados = ctx.getImageData(0, 0, w, h).data;
    let limpos = 0, amostras = 0;
    for (let i = 3; i < dados.length; i += 28) {
      amostras++;
      if (dados[i] < 100) limpos++;
    }
    if (limpos / amostras > 0.55) revelar();
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (revelada) return;
    e.preventDefault();
    raspando = true;
    ultimo = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignora */ }
    riscar(ponto(e));
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!raspando) return;
    riscar(ponto(e));
    const agora = performance.now();
    if (agora - ultimaChecagem > 150) {
      ultimaChecagem = agora;
      checar();
    }
  });

  ["pointerup", "pointercancel", "lostpointercapture"].forEach((tipo) => {
    canvas.addEventListener(tipo, () => {
      if (!raspando) return;
      raspando = false;
      ultimo = null;
      checar();
    });
  });

  /* ---------- Fonte que cabe (palavras longas, tipo hashtag) ---------- */
  function ajustarFonte() {
    elFrase.style.fontSize = "";
    elFrase.style.overflowWrap = "normal"; // mede sem quebrar palavra no meio
    let tam = parseFloat(getComputedStyle(elFrase).fontSize);
    while (elFrase.scrollWidth > elFrase.clientWidth + 1 && tam > 14) {
      tam -= 1;
      elFrase.style.fontSize = tam + "px";
    }
    elFrase.style.overflowWrap = ""; // se nem assim couber, quebra a palavra
  }

  window.addEventListener("resize", ajustarFonte);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarFonte);

  /* ---------- Polaroid ---------- */
  const fotos = Array.isArray(CONFIG.fotos) ? CONFIG.fotos : [];
  const palco = $("#palco");
  const polaroid = $("#polaroid");
  const fotoImg = $("#fotoImg");
  $("#legenda").textContent = CONFIG.legendaFoto || nome;

  let ordemFotos = embaralhar(fotos.length);
  let posFoto = 0;
  let fotoDaVez = null;
  let fotoMostrada = false;

  function proximaFoto() {
    if (!fotos.length) return null;
    if (posFoto >= fotos.length) {
      const ultima = ordemFotos[fotos.length - 1];
      ordemFotos = embaralhar(fotos.length);
      if (fotos.length > 1 && ordemFotos[0] === ultima) {
        [ordemFotos[0], ordemFotos[1]] = [ordemFotos[1], ordemFotos[0]];
      }
      posFoto = 0;
    }
    return fotos[ordemFotos[posFoto++]];
  }

  // escolhe a foto do próximo bilhete e já deixa carregando
  function prepararFoto() {
    fotoDaVez = proximaFoto();
    if (!fotoDaVez) return;
    new Image().src = fotoDaVez;
    if (!fotoMostrada && !polaroid.classList.contains("guardando")) fotoImg.src = fotoDaVez;
  }

  // tamanho da polaroid: cabe entre o topo da página e o bilhete
  function dimensionarPolaroid() {
    const topoPalco = palco.getBoundingClientRect().top + window.scrollY;
    const sobre = 46, margem = 24, pad = 10, legenda = 46;
    let w = topoPalco + sobre - margem - legenda + pad;
    w = Math.min(w, palco.clientWidth * 0.66, 260);
    w = Math.max(w, 140);
    polaroid.style.setProperty("--pw", Math.round(w) + "px");
  }

  function mostrarPolaroid() {
    if (!fotoDaVez) return;
    if (fotoImg.getAttribute("src") !== fotoDaVez) fotoImg.src = fotoDaVez;
    dimensionarPolaroid();
    const giro = (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 4);
    polaroid.style.setProperty("--giro", giro.toFixed(1) + "deg");
    polaroid.classList.remove("guardando", "saltou");
    void polaroid.offsetWidth;
    polaroid.classList.add("saltou");
    polaroid.setAttribute("aria-hidden", "false");
    fotoMostrada = true;
    if (window.scrollY > 4) {
      window.scrollTo({ top: 0, behavior: reduzMovimento ? "auto" : "smooth" });
    }
  }

  function guardarPolaroid() {
    if (!fotoMostrada) return;
    fotoMostrada = false;
    polaroid.setAttribute("aria-hidden", "true");
    polaroid.classList.remove("saltou");
    if (!reduzMovimento) polaroid.classList.add("guardando");
  }

  polaroid.addEventListener("animationend", (e) => {
    if (e.animationName !== "guarda") return;
    polaroid.classList.remove("guardando");
    if (fotoDaVez && !fotoMostrada) fotoImg.src = fotoDaVez;
  });

  window.addEventListener("resize", () => { if (fotoMostrada) dimensionarPolaroid(); });

  /* ---------- Mostrar / revelar ---------- */
  function linkWhatsApp() {
    const url = location.href.split("#")[0].split("?")[0];
    const texto =
      "\u201C" + frases[indiceAtual] + "\u201D\n\n" +
      "Tirei essa na raspadinha do aniversário da " + nome + ". Raspe a sua: " + url;
    return "https://wa.me/?text=" + encodeURIComponent(texto);
  }

  function mostrar(indice, animar) {
    geracao++;
    indiceAtual = indice;
    revelada = false;
    raspando = false;
    ultimo = null;

    elFrase.textContent = frases[indice];
    elFrase.classList.toggle("longa", frases[indice].length > 80);
    ajustarFonte();
    elFrase.setAttribute("aria-hidden", "true");
    elNumero.textContent = "nº " + String(indice + 1).padStart(3, "0");
    elAviso.textContent = "";

    // volta a cobertura na hora, sem deixar a frase aparecer
    canvas.style.transition = "none";
    canvas.classList.remove("sumindo");
    canvas.hidden = false;
    void canvas.offsetWidth;
    canvas.style.transition = "";
    pintarCobertura();

    btnRevelar.style.visibility = "";
    btnZap.hidden = true;
    prepararFoto();

    if (animar && !reduzMovimento) {
      sombra.classList.remove("trocando");
      void sombra.offsetWidth;
      sombra.classList.add("trocando");
    }
  }

  function revelar() {
    if (revelada) return;
    revelada = true;
    raspando = false;
    const minhaGeracao = geracao;

    canvas.classList.add("sumindo");
    setTimeout(() => {
      if (revelada && geracao === minhaGeracao) canvas.hidden = true;
    }, reduzMovimento ? 0 : 460);

    elFrase.removeAttribute("aria-hidden");
    elAviso.textContent = "Frase revelada: " + frases[indiceAtual];
    btnRevelar.style.visibility = "hidden"; // some sem mexer no tamanho do bilhete
    btnZap.href = linkWhatsApp();
    btnZap.hidden = false;

    estado.lidas++;
    estado.pos++;
    salvar();
    atualizarContador();
    soltarConfete();
    mostrarPolaroid();
  }

  btnRevelar.addEventListener("click", revelar);

  btnOutra.addEventListener("click", () => {
    if (!revelada) estado.pos++; // pulou sem raspar
    if (estado.pos >= total) reembaralhar();
    salvar();
    guardarPolaroid();
    mostrar(estado.ordem[estado.pos], true);
    atualizarContador();
  });

  /* ---------- Confete ---------- */
  const confete = $("#confete");
  const cctx = confete.getContext("2d");
  const CORES = ["#FF4F8B", "#2B0F4C", "#1FB5A8", "#FFFFFF", "#FF9F1C"];
  let particulas = [];
  let animando = false;

  let ultimoQuadro = 0;

  // Sai sempre, inclusive em celular com "reduzir movimento" ligado
  // (nesse caso sai uma chuva menor e mais curta).
  function soltarConfete() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confete.width = Math.round(innerWidth * dpr);
    confete.height = Math.round(innerHeight * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const r = area.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const qtd = reduzMovimento ? 45 : 110;
    for (let i = 0; i < qtd; i++) {
      const ang = Math.random() * Math.PI * 2;
      const vel = 4 + Math.random() * 7;
      particulas.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * vel,
        vy: Math.sin(ang) * vel - 5,
        g: 0.22 + Math.random() * 0.1,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.3,
        cor: CORES[i % CORES.length],
        vida: 0
      });
    }
    if (!animando) {
      animando = true;
      ultimoQuadro = 0;
      requestAnimationFrame(quadro);
    }
  }

  function quadro(agora) {
    // passo baseado no tempo: mesma velocidade em tela de 60 Hz ou 120 Hz
    const passo = ultimoQuadro ? Math.min((agora - ultimoQuadro) / 16.67, 3) : 1;
    ultimoQuadro = agora;
    const vidaMax = reduzMovimento ? 120 : 240;

    cctx.clearRect(0, 0, innerWidth, innerHeight);
    particulas = particulas.filter((p) => p.y < innerHeight + 40 && p.vida < vidaMax);
    for (const p of particulas) {
      p.vida += passo;
      p.vx *= Math.pow(0.985, passo);
      p.vy += p.g * passo;
      p.x += p.vx * passo;
      p.y += p.vy * passo;
      p.rot += p.vr * passo;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.cor;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.vida * 0.15 + p.rot)) + 1);
      cctx.restore();
    }
    if (particulas.length) {
      requestAnimationFrame(quadro);
    } else {
      animando = false;
      cctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  /* ---------- Início ---------- */
  if (estado.pos >= total) reembaralhar();
  salvar();
  mostrar(estado.ordem[estado.pos], false);
  atualizarContador();
})();
</script>
</body>
</html>
